[package]
name = "winperf"
version = "0.8.8"
description = "Fob, a Windows performance monitor"
authors = ["you"]
edition = "2021"
rust-version = "1.88"

# Windows VERSIONINFO of the exe (tauri-build adds ProductName, FileDescription,
# FileVersion/ProductVersion from tauri.conf.json). CompanyName is the single
# place to change the publisher: sensors-helper/src/*.csproj reads it from here.
[package.metadata.tauri-winres]
CompanyName = "HCB"
LegalCopyright = "Copyright (c) 2026 HCB. Based on NeoHtop, Copyright (c) 2024 Abdenasser, MIT."
OriginalFilename = "fob.exe"
InternalName = "fob"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde_json = "1.0"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive", "rc"] }
tauri = { version = "2.1.1", features = ["macos-private-api", "tray-icon", "image-png"] }
sys-locale = "0.3"
sysinfo = { version = "0.35.2", features = ["disk", "multithread", "network", "system"] }
listeners = "0.6"
tauri-plugin-shell = "2"
tauri-plugin-os = "2"
tauri-plugin-global-shortcut = "=2.2.0"
window-vibrancy = "0.5.2"
rayon = "1.10.0"
tauri-plugin-window-state = "~2.2.0"
# 2.2.x is the last line that accepts tauri 2.1 (2.3 needs tauri 2.6).
tauri-plugin-single-instance = "~2.2.4"

[dev-dependencies]
# MockRuntime for the Windows single-instance test (companion.rs).
tauri = { version = "2.1.1", features = ["test"] }

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]

[profile.release]
panic = "abort"            # Strip expensive panic clean-up logic
codegen-units = 1          # Compile crates one after another so the compiler can optimize better
lto = "fat"                # More aggressive link-time optimization
opt-level = 3              # Optimize for maximum performance
strip = true               # Remove debug symbols
incremental = false         # Disable incremental compilation

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
file_icon_provider = "=1.0.2"
png = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
core-foundation = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
freedesktop-icons = "0.4"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
nvml-wrapper = "0.13"

[target.'cfg(target_os = "windows")'.dependencies]
ntfs-reader = "0.6"
# The WebView2 controller types tauri 2.1 hands out (main_window.rs).
webview2-com = "0.33"
windows-0-58 = { package = "windows", version = "0.58", features = ["Win32_Foundation"] }
windows-core-0-58 = { package = "windows-core", version = "0.58" }
windows = { version = "0.62.2", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_Graphics_Dwm", "Win32_System_EventLog", "Win32_System_Com", "Win32_System_TaskScheduler", "Win32_System_Variant", "Win32_System_Ole", "Win32_System_Diagnostics_Etw", "Win32_System_Ioctl", "Win32_System_IO", "Win32_Security", "Win32_Devices_DeviceAndDriverInstallation", "Win32_System_Wmi", "Win32_System_Rpc", "Win32_Storage_Nvme", "Win32_System_Power"] }

# Fob 0.7.10: global-hotkey 0.6.4 with the Windows release-poll fix from 0.8.0
# (vendor/global-hotkey/src/platform_impl/windows/mod.rs).
[patch.crates-io]
global-hotkey = { path = "vendor/global-hotkey" }
# Fob 0.8.8: tauri-plugin-single-instance 2.2.4 (the last line for tauri 2.1)
# with upstream's later Windows fixes (vendor/tauri-plugin-single-instance/
# src/platform_impl/windows.rs): wait for the first instance's window during
# a concurrent start, always exit, hand over the foreground, time out.
tauri-plugin-single-instance = { path = "vendor/tauri-plugin-single-instance" }

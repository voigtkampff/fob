<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;background:#4a6">
<iframe id="f" style="width:360px;height:652px;border:0"></iframe><pre id="out">pending</pre>
<script>
const q=new URLSearchParams(location.search);
document.documentElement.style.colorScheme=q.get("dark")?"dark":"light";
localStorage.setItem("theme",q.get("theme")||"catppuccin");
localStorage.setItem("neohtop_config",JSON.stringify({behavior:{language:"zh",miniOpacity:Number(q.get("o")||0),miniPinned:true}}));
const f=document.getElementById("f");f.src="/?view=companion";
f.onload=()=>setTimeout(()=>{const d=f.contentDocument,w=f.contentWindow;
 const b=d.querySelector('[aria-label="窗口不透明度"],[aria-label="Window opacity"]');
 for(const t of ["pointerdown","mousedown","pointerup","mouseup","click"]) b.dispatchEvent(new w.PointerEvent(t,{bubbles:true,button:0,pointerType:"mouse"}));
 setTimeout(()=>{const p=d.querySelector('[data-slot="popover-content"]');const out={open:!!p};
  if(p){const cs=w.getComputedStyle(p);out.bg=cs.backgroundColor;out.blur=cs.backdropFilter;out.textShadow=cs.textShadow;out.breakers=[];
   for(let e=p.parentElement;e&&e!==d.documentElement;e=e.parentElement){const c=w.getComputedStyle(e);
    const bad=[c.opacity!=="1"&&"opacity "+c.opacity,c.filter!=="none"&&"filter",c.maskImage&&c.maskImage!=="none"&&"mask",c.clipPath!=="none"&&"clip-path",c.backdropFilter!=="none"&&"backdrop-filter",c.mixBlendMode!=="normal"&&"blend",/opacity|filter/.test(c.willChange)&&"will-change "+c.willChange].filter(Boolean);
    if(bad.length)out.breakers.push(e.tagName+"."+e.className+": "+bad.join(","));}}
  document.getElementById("out").textContent=JSON.stringify(out);},1500);},2500);
</script></body></html>

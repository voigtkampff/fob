[package]
name = "fob-mft"
version = "0.8.1"
edition = "2021"

[build-dependencies]
embed-resource = "2.5"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
ntfs-reader = "0.6"
windows = { version = "0.62.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[profile.release]
strip = true
lto = true
panic = "abort"

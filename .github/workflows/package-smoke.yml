name: Windows package smoke

# Runs an already built fob-windows-x86_64 zip on a hosted Windows desktop.
# Nothing is rebuilt: the zip must come from a successful Build Check or
# Draft Release run of this repository, for the given commit and hash.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build Check or Draft Release run that uploaded fob-windows-x86_64
        required: true
      source_sha:
        description: Full commit SHA that run built
        required: true
      zip_sha256:
        description: Expected SHA256 of the Fob zip inside the artifact
        required: true
  push:
    branches: [ci/windows-package-smoke]

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    name: Smoke (${{ matrix.target.name }})
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event_name == 'push' && '[{"name":"0.8.6 release","run":"42834478618","sha":"71d89a29a34956fc997c0c9b4c8312e2d423d0a4","zip":"ade6e4cabd532ed8092fc48a2d27f8256e62d128509e4f470c64cba17c9ee46d"},{"name":"0.8.7 SATA test","run":"42894650101","sha":"2f612e5a6fe6e17ed86df892d09ade037a19396d","zip":"6dc64702e524322e3bc00950e96f96a4c5ceb65e13444bffe968d15dbf2fb671"}]' || '[{"name":"dispatch"}]') }}
    env:
      RUN_ID: ${{ inputs.run_id || matrix.target.run }}
      SOURCE_SHA: ${{ inputs.source_sha || matrix.target.sha }}
      ZIP_SHA256: ${{ inputs.zip_sha256 || matrix.target.zip }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Download and verify the package
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/package-smoke/provenance.mjs "$env:RUN_ID" "$env:SOURCE_SHA" "$env:ZIP_SHA256" "$env:RUNNER_TEMP\package"
      - name: Run the package
        run: node scripts/package-smoke/run.mjs "$env:FOB_DIR" "$env:RUNNER_TEMP\evidence"
      - name: Summarize
        if: always()
        run: |
          Copy-Item "$env:RUNNER_TEMP\package\provenance.json" "$env:RUNNER_TEMP\evidence" -ErrorAction SilentlyContinue
          "Automation commit: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY
          "Package run $env:RUN_ID, commit $env:SOURCE_SHA, zip $env:ZIP_SHA256, fob.exe $env:FOB_EXE_SHA256" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-smoke-${{ strategy.job-index }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn

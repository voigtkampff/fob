name: Build Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  quality:
    name: Source checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run build:site
      - run: npm run test:release
      - run: npm run release:check
      - run: npm run build

  windows-tests:
    name: Windows tests
    needs: quality
    # Windows jobs run only for manual runs and for release.yml on v* tags.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Prepare frontend assets for native tests
        # generate_context! embeds frontendDist even in cargo test builds.
        run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  package:
    name: Package (windows-x86_64)
    needs: windows-tests
    # Cross-built like every released zip: the 0.8.2 helper only reproduces
    # with cargo-xwin and lld, not with the MSVC linker on a Windows runner.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      XWIN_CRT_VERSION: 14.44.17.14
      XWIN_SDK_VERSION: 10.0.26100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.427
      - name: Install the cross toolchain
        working-directory: ${{ runner.temp }}
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          rustup default stable
          curl -fsSLO https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64.tar.xz
          echo "55064b60b991a1e1e8090b8c2f84e82b22cfe5903d12c159d65064cf5e8ae335  llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64.tar.xz" | sha256sum -c -
          tar xJf llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64.tar.xz
          echo "LLVM_MINGW=$RUNNER_TEMP/llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64" >> "$GITHUB_ENV"
          cargo install cargo-xwin --version 0.23.1 --locked
          pip install pefile==2024.8.26
      - run: npm ci
      - run: scripts/package-windows.sh
      - name: Stage the zip
        run: node scripts/release.mjs stage dist artifacts
      - name: Preview the release notes
        run: node scripts/release.mjs notes artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: fob-windows-x86_64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
